services:
  browser-farm:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8787
      MAX_PARALLEL: 4
      PROFILE_ROOT: /data/profiles
      QUEUE_ROOT: /data/queue
      ARTIFACT_ROOT: /data/artifacts
      FARM_TOKEN: ${FARM_TOKEN}
      HEADLESS: "true"
    ports:
      - "8787:8787"
    volumes:
      - browser_data:/data
    shm_size: "2gb"

volumes:
  browser_data:
