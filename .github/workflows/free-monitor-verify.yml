name: CYZOR Free Monitor Verification

on:
  push:
    paths:
      - 'automation/free-monitor/verify.mjs'
      - '.github/workflows/free-monitor-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        working-directory: automation/free-monitor
        run: npm test
      - name: Verify two monitor cycles
        run: node automation/free-monitor/verify.mjs
      - name: Persist verification
        shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add FREE_MONITOR_STATE.json FREE_MONITOR_EVENTS.json FREE_MONITOR_VERIFICATION.json
          git diff --cached --quiet || git commit -m "verify free monitor cadence"
          git pull --rebase origin main
          git push origin HEAD:main
