name: CYZOR Free Monitor Verification

on:
  push:
    branches: [main]
    paths:
      - 'automation/free-monitor/verify.mjs'
      - '.github/workflows/free-monitor-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  MONITOR_STATE_BRANCH: cyzor-free-monitor-state

concurrency:
  group: cyzor-free-monitor-worker
  cancel-in-progress: false

jobs:
  verify:
    # Manual dispatch can select a branch, so the trigger filter alone is not enough.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore durable monitor state
        shell: bash
        run: |
          if git fetch --no-tags origin "$MONITOR_STATE_BRANCH:refs/remotes/origin/$MONITOR_STATE_BRANCH"; then
            git show "origin/$MONITOR_STATE_BRANCH:FREE_MONITOR_STATE.json" > FREE_MONITOR_STATE.json
            git show "origin/$MONITOR_STATE_BRANCH:FREE_MONITOR_EVENTS.json" > FREE_MONITOR_EVENTS.json
          fi
      - name: Unit tests
        working-directory: automation/free-monitor
        run: npm test
      - name: Verify two monitor cycles
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          code=0
          node automation/free-monitor/verify.mjs || code=$?
          if [[ "$code" == 0 || "$code" == 2 ]]; then
            echo "pair_ready=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
      - name: Persist verification
        env:
          PAIR_READY: ${{ steps.verify.outputs.pair_ready }}
        shell: bash
        run: |
          set -euo pipefail
          verification_file=$(mktemp)
          state_worktree=$(mktemp -d)
          cp FREE_MONITOR_VERIFICATION.json "$verification_file"
          state_file=''
          events_file=''
          if [[ "$PAIR_READY" == true ]]; then
            state_file=$(mktemp)
            events_file=$(mktemp)
            cp FREE_MONITOR_STATE.json "$state_file"
            cp FREE_MONITOR_EVENTS.json "$events_file"
          fi
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true
            rm -f "$verification_file"
            [[ -z "$state_file" ]] || rm -f "$state_file"
            [[ -z "$events_file" ]] || rm -f "$events_file"
          }
          trap cleanup EXIT
          if git show-ref --verify --quiet "refs/remotes/origin/$MONITOR_STATE_BRANCH"; then
            git worktree add -B "$MONITOR_STATE_BRANCH" "$state_worktree" "origin/$MONITOR_STATE_BRANCH"
          else
            git worktree add -B "$MONITOR_STATE_BRANCH" "$state_worktree" HEAD
          fi
          cp "$verification_file" "$state_worktree/FREE_MONITOR_VERIFICATION.json"
          if [[ "$PAIR_READY" == true ]]; then
            cp "$state_file" "$state_worktree/FREE_MONITOR_STATE.json"
            cp "$events_file" "$state_worktree/FREE_MONITOR_EVENTS.json"
          fi
          cd "$state_worktree"
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add FREE_MONITOR_VERIFICATION.json
          if [[ "$PAIR_READY" == true ]]; then
            git add FREE_MONITOR_STATE.json FREE_MONITOR_EVENTS.json
          fi
          git diff --cached --quiet || git commit -m "verify free monitor cadence [skip ci]"
          git push origin "HEAD:refs/heads/$MONITOR_STATE_BRANCH"
      - name: Fail on unsuccessful verification
        if: steps.verify.outcome == 'failure'
        run: exit 1
