name: CYZOR Free Monitor Verification

on:
  push:
    branches: [main]
    paths:
      - 'automation/free-monitor/verify.mjs'
      - '.github/workflows/free-monitor-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyzor-free-monitor-worker
  cancel-in-progress: false

jobs:
  verify:
    # Manual dispatch can select a branch, so the trigger filter alone is not enough.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        working-directory: automation/free-monitor
        run: npm test
      - name: Verify two monitor cycles
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          code=0
          node automation/free-monitor/verify.mjs || code=$?
          if [[ "$code" == 0 || "$code" == 2 ]]; then
            echo "pair_ready=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
      - name: Persist verification
        env:
          PAIR_READY: ${{ steps.verify.outputs.pair_ready }}
        shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add FREE_MONITOR_VERIFICATION.json
          if [[ "$PAIR_READY" == true ]]; then
            git add FREE_MONITOR_STATE.json FREE_MONITOR_EVENTS.json
          else
            git restore --worktree -- FREE_MONITOR_STATE.json FREE_MONITOR_EVENTS.json
          fi
          git diff --cached --quiet || git commit -m "verify free monitor cadence"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail on unsuccessful verification
        if: steps.verify.outcome == 'failure'
        run: exit 1
