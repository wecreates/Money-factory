name: Local agent durable queue
on:
  pull_request:
    paths:
      - 'integrations/local_agent_queue.py'
      - 'integrations/test_local_agent_queue.py'
      - 'integrations/local_queue/**'
      - 'integrations/openclaw/**'
      - 'integrations/ruflo/**'
      - 'integrations/agent_capacity.py'
      - '.github/workflows/local-agent-queue.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/local_agent_queue.py'
      - 'integrations/test_local_agent_queue.py'
      - 'integrations/local_queue/**'
      - 'integrations/openclaw/**'
      - 'integrations/ruflo/**'
      - 'integrations/agent_capacity.py'
      - '.github/workflows/local-agent-queue.yml'
permissions:
  contents: read
jobs:
  crash-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest integrations.test_local_agent_queue -v
