name: Verify live CYZOR website rendering
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-website-seo.yml'
      - 'integrations/jobs/cyzor-website-render.*.json'
permissions:
  contents: write
jobs:
  render:
    uses: ./.github/workflows/repository-job.yml
    with:
      job: cyzor-website-render.job.json
