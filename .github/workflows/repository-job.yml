name: Process reviewed Content Control repository job
on:
  workflow_call:
    inputs:
      job:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      job:
        description: Reviewed filename under integrations/jobs
        required: true
        default: amex-vs-chase-audit.job.json
        type: string
  push:
    branches: [main]
    paths: ['integrations/jobs/amex-vs-chase-audit.*.json', '.github/workflows/repository-job.yml', 'integrations/hosted_job.py', 'integrations/persist_job.py', 'integrations/check_live_content_control.py', 'integrations/test_check_live_content_control.py']
permissions:
  contents: read
concurrency:
  group: repository-jobs
  cancel-in-progress: false
jobs:
  process:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PUBLICATION_ENABLED: 'false'
      PAID_GENERATION_ENABLED: 'false'
      JOB_FILE: ${{ inputs.job || 'amex-vs-chase-audit.job.json' }}
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: wecreates/content-control
          ref: 00fbb60bf345a312563ac4da13812933fe86619c
          path: content-control-bridge
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate reviewed job before installing its runtime
        id: job
        run: |
          set -euo pipefail
          python -m unittest discover -s integrations -p 'test_hosted_job.py'
          python -m unittest discover -s integrations -p 'test_persist_job.py'
          python -m unittest discover -s integrations -p 'test_check_live_content_control.py'
          tool=$(python integrations/hosted_job.py "$JOB_FILE" --runtime "$RUNNER_TEMP/runtime" --content-control content-control-bridge --output "$RUNNER_TEMP/job-output" --print-tool)
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
      - name: Install selected free CPU runtime
        env:
          TOOL: ${{ steps.job.outputs.tool }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg build-essential python3-dev
          if [ "$TOOL" = claude-seo ]; then
            python integrations/setup.py "$TOOL" --runtime "$RUNNER_TEMP/runtime" --browser
            "$RUNNER_TEMP/runtime/seo/.venv/bin/python" -m playwright install-deps chromium
          else
            python integrations/setup.py "$TOOL" --runtime "$RUNNER_TEMP/runtime"
          fi
      - name: Process job through Content Control
        run: >-
          python integrations/hosted_job.py "$JOB_FILE"
          --runtime "$RUNNER_TEMP/runtime" --content-control content-control-bridge
          --output "$RUNNER_TEMP/job-output"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-repository-job-output
          path: |
            ${{ runner.temp }}/job-output/result*
            ${{ runner.temp }}/job-output/job-evidence.json
            ${{ runner.temp }}/job-output/toonflow-data/**/cyzor-content-brief.json
          if-no-files-found: error
          retention-days: 1
  record:
    needs: process
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-repository-job-output
          path: ${{ runner.temp }}/job-output
      - name: Verify and persist reviewed public result
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python integrations/persist_job.py --artifact-dir "$RUNNER_TEMP/job-output" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --revision "$SOURCE_REVISION"
          git config user.name cyzor-repository-jobs
          git config user.email actions@users.noreply.github.com
          git add integrations/results/runs
          git diff --cached --quiet && exit 0
          git commit -m "Persist verified public repository job output"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
