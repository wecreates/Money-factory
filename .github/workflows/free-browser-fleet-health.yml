name: CYZOR Free Browser Fleet Health

on:
  push:
    paths:
      - '.github/workflows/free-browser-fleet-health.yml'
      - 'automation/github-browser-fleet/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUSINESS_ID: cyzor-site
      TASK_FILE: tasks/cyzor-site.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: automation/github-browser-fleet
        run: |
          npm install
          npx playwright install chromium
      - name: Tests
        working-directory: automation/github-browser-fleet
        run: npm test
      - name: Public browser smoke
        working-directory: automation/github-browser-fleet
        run: node src/run-business.mjs
      - name: Persist proof
        shell: bash
        run: |
          cp automation/github-browser-fleet/artifacts/cyzor-site/result.json BROWSER_FLEET_STATUS.json
          git config user.name "cyzor-browser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add BROWSER_FLEET_STATUS.json
          git diff --cached --quiet || git commit -m "verify free GitHub browser fleet"
          git pull --rebase origin main
          git push origin HEAD:main
