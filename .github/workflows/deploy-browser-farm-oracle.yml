
name: Deploy Browser Farm to Oracle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/browser-farm/**'
      - '!automation/browser-farm/cloud-queue/**'
      - '.github/workflows/deploy-browser-farm-oracle.yml'

concurrency:
  group: oracle-browser-farm-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      FARM_GITHUB_TOKEN: ${{ secrets.FARM_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY FARM_GITHUB_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 2
            fi
          done

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -T 10 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Package browser farm
        shell: bash
        run: |
          set -euo pipefail
          tar             --exclude='cloud-queue/*.json'             --exclude='node_modules'             -czf /tmp/cyzor-browser-farm.tgz             -C automation browser-farm

      - name: Upload browser farm
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/oracle_key /tmp/cyzor-browser-farm.tgz             "$ORACLE_USER@$ORACLE_HOST:/tmp/cyzor-browser-farm.tgz"

      - name: Install and start on Oracle
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST"             "FARM_GITHUB_TOKEN='$FARM_GITHUB_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail

          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi

          if ! command -v docker >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y ca-certificates curl docker.io docker-compose-v2
          fi

          $SUDO systemctl enable --now docker

          $SUDO mkdir -p /opt/cyzor/browser-farm
          $SUDO tar -xzf /tmp/cyzor-browser-farm.tgz             --strip-components=1             -C /opt/cyzor/browser-farm

          $SUDO chown -R "$USER":"$USER" /opt/cyzor/browser-farm

          cd /opt/cyzor/browser-farm

          cat > .env <<ENV
          MAX_PARALLEL=3
          HEADLESS=true
          GITHUB_TOKEN=$FARM_GITHUB_TOKEN
          GITHUB_REPOSITORY=wecreates/Money-factory
          GITHUB_BRANCH=main
          GITHUB_QUEUE_PATH=automation/browser-farm/cloud-queue
          GITHUB_POLL_MS=15000
          ENV

          chmod 600 .env

          $SUDO docker compose up -d --build --remove-orphans
          $SUDO docker image prune -f

          echo "=== Browser Farm Containers ==="
          $SUDO docker compose ps
          echo "=== Browser Farm Recent Logs ==="
          $SUDO docker compose logs --tail=80
          REMOTE

      - name: Verify farm process
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST"             "cd /opt/cyzor/browser-farm && sudo docker compose ps --status running | grep browser-farm"
