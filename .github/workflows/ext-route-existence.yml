name: CYZOR Ext Route Existence Probe

on:
  push:
    paths:
      - 'automation/novan-scheduler/ext-route-existence.mjs'
      - '.github/workflows/ext-route-existence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation/novan-scheduler/ext-route-existence.mjs
      - shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add EXT_ROUTE_EXISTENCE_PROBE.json
          git diff --cached --quiet || git commit -m "probe extension check routes"
          git push
