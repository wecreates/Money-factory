name: Ruflo local execution boundaries
on:
  pull_request:
    paths:
      - 'integrations/ruflo/**'
      - 'integrations/agent_capacity.py'
      - 'integrations/owned_process.py'
      - 'integrations/test_owned_process.py'
      - '.github/workflows/ruflo-local-tests.yml'
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s integrations/ruflo -p 'test*.py' -v
      - run: python -m unittest -v integrations.test_owned_process integrations.test_agent_capacity
      - run: node --check integrations/ruflo/execute.mjs
