name: VoiceStudio free narration integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['integrations/voicestudio/**', 'integrations/jobs/voicestudio-**', 'integrations/vendor/voicestudio', 'integrations/run.py', 'integrations/setup.py', 'integrations/hosted_job.py', 'integrations/persist_job.py', 'integrations/repositories.json', '.github/workflows/repository-job.yml', '.github/workflows/voicestudio-integration.yml']
permissions:
  contents: read
jobs:
  boundaries:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m unittest discover -s integrations -p 'test_voice*.py'
          python -m unittest discover -s integrations -p 'test_rea_wiring.py'
          python -m unittest discover -s integrations -p 'test_persist_job.py'
          python -m unittest discover -s integrations -p 'test_verify.py'
  narration:
    needs: boundaries
    permissions:
      contents: write
    uses: ./.github/workflows/repository-job.yml
    with:
      job: voicestudio-narration.job.json
