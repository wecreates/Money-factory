name: CYZOR Host Probe

on:
  push:
    paths:
      - 'automation/novan-scheduler/host-probe.mjs'
      - '.github/workflows/cyzor-host-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation/novan-scheduler/host-probe.mjs
      - shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CYZOR_HOST_PROBE.json
          git diff --cached --quiet || git commit -m "record CYZOR host probe"
          git push
