name: CYZOR Free Monitor Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FREE_MONITOR_WATCHES.json'
      - 'automation/free-monitor/**'
      - '.github/workflows/free-monitor-worker.yml'

permissions:
  contents: write

env:
  MONITOR_STATE_BRANCH: cyzor-free-monitor-state
  MONITOR_WORKFLOW_WALL_LIMIT_MS: 300000

concurrency:
  group: cyzor-free-monitor-worker
  cancel-in-progress: false

jobs:
  monitor:
    # Manual dispatch can select a branch, so the trigger filter alone is not enough.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore durable monitor state
        shell: bash
        run: |
          if git fetch --no-tags origin "$MONITOR_STATE_BRANCH:refs/remotes/origin/$MONITOR_STATE_BRANCH"; then
            git show "origin/$MONITOR_STATE_BRANCH:FREE_MONITOR_STATE.json" > FREE_MONITOR_STATE.json
            git show "origin/$MONITOR_STATE_BRANCH:FREE_MONITOR_EVENTS.json" > FREE_MONITOR_EVENTS.json
          fi
      - name: Unit tests
        working-directory: automation/free-monitor
        run: npm test
      - name: Run free monitor worker
        id: check
        continue-on-error: true
        shell: bash
        run: |
          code=0
          node automation/free-monitor/worker.mjs || code=$?
          if [[ "$code" == 0 || "$code" == 2 ]]; then
            echo "pair_ready=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
      - name: Persist monitor state
        if: steps.check.outputs.pair_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          state_file=$(mktemp)
          events_file=$(mktemp)
          state_worktree=$(mktemp -d)
          cp FREE_MONITOR_STATE.json "$state_file"
          cp FREE_MONITOR_EVENTS.json "$events_file"
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true
            rm -f "$state_file" "$events_file"
          }
          trap cleanup EXIT
          state_branch_exists=false
          if git show-ref --verify --quiet "refs/remotes/origin/$MONITOR_STATE_BRANCH"; then
            state_branch_exists=true
            git worktree add -B "$MONITOR_STATE_BRANCH" "$state_worktree" "origin/$MONITOR_STATE_BRANCH"
          else
            git worktree add -B "$MONITOR_STATE_BRANCH" "$state_worktree" HEAD
          fi
          cp "$state_file" "$state_worktree/FREE_MONITOR_STATE.json"
          cp "$events_file" "$state_worktree/FREE_MONITOR_EVENTS.json"
          cd "$state_worktree"
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add FREE_MONITOR_STATE.json FREE_MONITOR_EVENTS.json
          if git diff --cached --quiet; then
            if [[ "$state_branch_exists" == false ]]; then
              git push origin "HEAD:refs/heads/$MONITOR_STATE_BRANCH"
            fi
            exit 0
          fi
          git commit -m "free monitor cadence tick [skip ci]"
          git push origin "HEAD:refs/heads/$MONITOR_STATE_BRANCH"
      - name: Fail on unhealthy targets
        if: steps.check.outcome == 'failure'
        run: exit 2
