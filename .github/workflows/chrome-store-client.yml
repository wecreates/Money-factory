name: CYZOR Chrome Store Client Tests

on:
  push:
    paths:
      - 'automation/chrome-store/**'
      - '.github/workflows/chrome-store-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Chrome Web Store API client
        working-directory: automation/chrome-store
        run: npm test
