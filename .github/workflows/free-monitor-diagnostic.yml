name: CYZOR Free Monitor Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-monitor-diagnostic.yml'
      - 'automation/free-monitor/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  MONITOR_STATE_BRANCH: cyzor-free-monitor-state

concurrency:
  group: cyzor-free-monitor-worker
  cancel-in-progress: false

jobs:
  diagnose:
    # Manual dispatch can select a branch, so the trigger filter alone is not enough.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore durable monitor state
        shell: bash
        run: |
          if git fetch --no-tags origin "$MONITOR_STATE_BRANCH:refs/remotes/origin/$MONITOR_STATE_BRANCH"; then
            git show "origin/$MONITOR_STATE_BRANCH:FREE_MONITOR_STATE.json" > FREE_MONITOR_STATE.json
            git show "origin/$MONITOR_STATE_BRANCH:FREE_MONITOR_EVENTS.json" > FREE_MONITOR_EVENTS.json
          fi
      - name: Run diagnostic
        id: diag
        continue-on-error: true
        shell: bash
        run: |
          TEST_CODE=0
          TEST_OUT=$(cd automation/free-monitor && npm test 2>&1) || TEST_CODE=$?
          WORKER_CODE=0
          WORKER_OUT=$(node automation/free-monitor/worker.mjs 2>&1) || WORKER_CODE=$?
          node - "$TEST_CODE" "$WORKER_CODE" "$TEST_OUT" "$WORKER_OUT" <<'NODE'
          const fs=require('fs');
          const [testCode,workerCode,testOut,workerOut]=process.argv.slice(2);
          const report={
            checked_at:new Date().toISOString(),
            test_code:Number(testCode),
            worker_code:Number(workerCode),
            test_output:testOut.slice(0,12000),
            worker_output:workerOut.slice(0,12000),
            state_exists:fs.existsSync('FREE_MONITOR_STATE.json'),
            events_exists:fs.existsSync('FREE_MONITOR_EVENTS.json')
          };
          report.state_persistence_complete=[0,2].includes(report.worker_code);
          if(report.state_persistence_complete && report.state_exists) {
            report.state=JSON.parse(fs.readFileSync('FREE_MONITOR_STATE.json','utf8'));
          }
          fs.writeFileSync('FREE_MONITOR_DIAGNOSTIC.json',JSON.stringify(report,null,2)+'\n');
          NODE
          echo "report_ready=true" >> "$GITHUB_OUTPUT"
          if [[ "$WORKER_CODE" == 0 || "$WORKER_CODE" == 2 ]]; then
            echo "pair_ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$TEST_CODE" != 0 ]]; then exit "$TEST_CODE"; fi
          exit "$WORKER_CODE"
      - name: Persist diagnostic
        if: steps.diag.outputs.report_ready == 'true'
        env:
          PAIR_READY: ${{ steps.diag.outputs.pair_ready }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_file=$(mktemp)
          state_worktree=$(mktemp -d)
          cp FREE_MONITOR_DIAGNOSTIC.json "$diagnostic_file"
          state_file=''
          events_file=''
          if [[ "$PAIR_READY" == true ]]; then
            state_file=$(mktemp)
            events_file=$(mktemp)
            cp FREE_MONITOR_STATE.json "$state_file"
            cp FREE_MONITOR_EVENTS.json "$events_file"
          fi
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true
            rm -f "$diagnostic_file"
            [[ -z "$state_file" ]] || rm -f "$state_file"
            [[ -z "$events_file" ]] || rm -f "$events_file"
          }
          trap cleanup EXIT
          if git show-ref --verify --quiet "refs/remotes/origin/$MONITOR_STATE_BRANCH"; then
            git worktree add -B "$MONITOR_STATE_BRANCH" "$state_worktree" "origin/$MONITOR_STATE_BRANCH"
          else
            git worktree add -B "$MONITOR_STATE_BRANCH" "$state_worktree" HEAD
          fi
          cp "$diagnostic_file" "$state_worktree/FREE_MONITOR_DIAGNOSTIC.json"
          if [[ "$PAIR_READY" == true ]]; then
            cp "$state_file" "$state_worktree/FREE_MONITOR_STATE.json"
            cp "$events_file" "$state_worktree/FREE_MONITOR_EVENTS.json"
          fi
          cd "$state_worktree"
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add FREE_MONITOR_DIAGNOSTIC.json
          if [[ "$PAIR_READY" == true ]]; then
            git add FREE_MONITOR_STATE.json FREE_MONITOR_EVENTS.json
          fi
          git diff --cached --quiet || git commit -m "record free monitor diagnostic [skip ci]"
          git push origin "HEAD:refs/heads/$MONITOR_STATE_BRANCH"
      - name: Fail on unsuccessful diagnostic
        if: steps.diag.outcome == 'failure'
        run: exit 1
