name: CYZOR Novan System Route Probe

on:
  push:
    paths:
      - 'automation/novan-scheduler/system-routes.mjs'
      - '.github/workflows/novan-system-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation/novan-scheduler/system-routes.mjs
      - shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add NOVAN_SYSTEM_ROUTES.json NOVAN_SYSTEM_ROUTES.txt
          git diff --cached --quiet || git commit -m "record Novan system routes"
          git push
