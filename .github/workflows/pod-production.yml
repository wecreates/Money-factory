name: POD cross-repository review verification
on:
  pull_request:
    paths: ['integrations/pod/**', '.github/workflows/pod-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pod_test_only
          POSTGRES_DB: pod_bridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pod_bridge_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POD_BRIDGE_TEST_DATABASE_URL: postgresql://postgres:pod_test_only@localhost:5432/pod_bridge_test
      CONTENT_CONTROL_ROOT: ${{ github.workspace }}/content-control-test
      PUBLICATION_ENABLED: 'false'
      POD_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wecreates/content-control
          ref: 37083916ddd224ea7a20aebf0a6db261ad3ee363
          path: content-control-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0 reportlab==4.4.9 PyMuPDF==1.26.6 numpy==2.3.5 opencv-python-headless==5.0.0.93 fonttools==4.61.1
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci --ignore-scripts
        working-directory: content-control-test
      - name: Verify pinned review and POD contracts
        run: node --test tests/pod-review-cli.test.mjs tests/pod-qa-binding.test.mjs tests/pod-qa-process.test.mjs tests/pod-operations.test.mjs tests/pod-request-errors.test.mjs tests/pod-evidence-time.test.mjs tests/pod-envelope-clock.test.mjs tests/pod-envelope-json.test.mjs tests/pod-mode-types.test.mjs tests/pod-task-json.test.mjs tests/pod-task-resolver.test.mjs tests/pod-claim-evidence.test.mjs tests/pod-market-evidence.test.mjs tests/pod-production-lease.test.mjs tests/pod-release-freshness.test.mjs tests/pod-kdp-weekly-submission.test.mjs tests/pod-account-platform-claim.test.mjs tests/pod-dashboard.test.mjs tests/pod-http-response.test.mjs tests/pod-grant-client.test.mjs tests/pod-intake-revocation.test.mjs tests/pod-container-smoke.test.mjs tests/pod-artifact-batch.test.mjs tests/pod-artifact-archive.test.mjs tests/pod-state-archive.test.mjs tests/pod-python-stage.test.mjs tests/pod-deploy-commit-policy.test.mjs tests/pod-template-production.test.mjs tests/pod-template-source.test.mjs tests/pod-preflight.test.mjs
        working-directory: content-control-test
      - name: Verify strict Python evidence and bounded JSON
        run: python -m unittest discover -s tests -p test_pod_evidence.py
        working-directory: content-control-test
      - name: Verify bounded review export response JSON
        run: python -m unittest discover -s tests -p test_pod_review_export.py
        working-directory: content-control-test
      - name: Verify review, asset and KDP book assembly recovery
        run: python -m unittest discover -s tests -p test_pod_review_recovery.py
        working-directory: content-control-test
      - name: Verify pinned art and KDP interior output safety
        run: python -m unittest discover -s tests -p test_pod_binary_io.py
        working-directory: content-control-test
      - name: Verify original-art identity and independent layout
        run: python -m unittest discover -s tests -p test_pod_raster_bounds.py
        working-directory: content-control-test
      - name: Verify independent KDP PDF and cover pairing
        run: python -m unittest discover -s tests -p test_pod_book_bounds.py
        working-directory: content-control-test
      - name: Verify current scoped font-rights evidence
        run: python -m unittest discover -s tests -p test_pod_font_rights.py
        working-directory: content-control-test
      - name: Verify retained official KDP interior-template source
        run: python -m unittest discover -s tests -p test_pod_kdp_interior_template_import.py
        working-directory: content-control-test
      - name: Verify KDP metadata, original manuscript/font rights, template source, CMYK cover and editorial-bound QA
        run: PYTHONPATH=tests python -m unittest test_pod.PODTests.test_kdp_original_manuscript_is_required_and_editorial_hash_must_match test_pod.PODTests.test_kdp_original_font_source_is_required_and_reported test_pod.PODTests.test_kdp_current_scoped_font_rights_and_retained_license_are_required test_pod.PODTests.test_rebound_substituted_interior_text_does_not_match_original_manuscript test_pod.PODTests.test_kdp_qa_requires_declared_device_cmyk_cover test_pod.PODTests.test_kdp_original_title_fonts_and_all_rendered_pixels_pass_independent_preflight test_pod.PODTests.test_kdp_requires_book_details_matching_front_cover_and_title_page test_pod.PODTests.test_kdp_book_details_reject_template_placeholder test_pod.PODTests.test_kdp_book_details_require_distinct_cover_fields test_pod.PODTests.test_kdp_book_details_reject_prohibited_metadata test_pod.PODTests.test_kdp_book_details_bind_edition_series_and_contributors test_pod.PODTests.test_kdp_book_details_validate_isbn_and_imprint test_pod.PODTests.test_kdp_book_details_require_ai_generated_disclosure test_pod.PODTests.test_kdp_book_details_bind_discovery_metadata test_pod.PODTests.test_kdp_book_details_bind_primary_audience test_pod.PODTests.test_kdp_book_details_require_substantive_book_lane test_pod.PODTests.test_kdp_book_details_bind_new_release_setup test_pod.PODTests.test_kdp_book_details_bind_individual_us_distribution_rights test_pod.PODTests.test_kdp_requires_current_scoped_regional_rights_evidence test_pod.PODTests.test_kdp_book_details_require_expanded_distribution_opt_out test_pod.PODTests.test_kdp_book_details_bind_primary_list_price test_pod.PODTests.test_kdp_book_details_bind_cover_finish test_pod.PODTests.test_kdp_cover_and_interior_print_options_must_match
        working-directory: content-control-test
      - run: node --test integrations/pod/*.test.mjs
      - run: CONTENT_CONTROL_ROOT="$GITHUB_WORKSPACE/content-control-test" python3 -m unittest discover -s integrations/pod -p 'test_*.py'
