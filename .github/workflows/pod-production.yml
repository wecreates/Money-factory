name: POD cross-repository review verification
on:
  pull_request:
    paths: ['integrations/pod/**', '.github/workflows/pod-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pod_test_only
          POSTGRES_DB: pod_bridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pod_bridge_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POD_BRIDGE_TEST_DATABASE_URL: postgresql://postgres:pod_test_only@localhost:5432/pod_bridge_test
      CONTENT_CONTROL_ROOT: ${{ github.workspace }}/content-control-test
      PUBLICATION_ENABLED: 'false'
      POD_PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wecreates/content-control
          ref: be78ab9e60e4fd301b2b1d246aa0d6d513075e1b
          path: content-control-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0 reportlab==4.4.9 PyMuPDF==1.26.6
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci --ignore-scripts
        working-directory: content-control-test
      - run: node --test integrations/pod/*.test.mjs
      - run: CONTENT_CONTROL_ROOT="$GITHUB_WORKSPACE/content-control-test" python3 -m unittest discover -s integrations/pod -p 'test_*.py'
