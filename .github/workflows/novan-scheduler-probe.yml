name: CYZOR Novan Scheduler Probe

on:
  push:
    paths:
      - 'automation/novan-scheduler/probe.mjs'
      - '.github/workflows/novan-scheduler-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live Novan API
        run: node automation/novan-scheduler/probe.mjs
      - name: Persist probe
        shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add NOVAN_SCHEDULER_PROBE.json NOVAN_SCHEDULER_PROBE.txt
          git diff --cached --quiet || git commit -m "record concise Novan scheduler probe"
          git push
