name: REA integrated engineering verification
on:
  pull_request:
    paths: ['integrations/rea/**', 'integrations/*rea*', 'integrations/run.py', 'integrations/setup.py', 'integrations/hosted_job.py', 'integrations/persist_job.py', 'integrations/repositories.json', 'integrations/jobs/rea-**', '.github/workflows/rea-offline-analysis.yml']
  push:
    branches: [main]
    paths: ['integrations/rea/**', 'integrations/*rea*', 'integrations/run.py', 'integrations/setup.py', 'integrations/hosted_job.py', 'integrations/persist_job.py', 'integrations/repositories.json', 'integrations/jobs/rea-**', '.github/workflows/rea-offline-analysis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLICATION_ENABLED: 'false'
      PAID_GENERATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the locked REA runtime and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y procps gcc
          python integrations/setup.py rea --runtime "$RUNNER_TEMP/rea-runtime"
          node "$RUNNER_TEMP/rea-runtime/rea/node_modules/playwright/cli.js" install-deps chromium
      - name: Verify boundaries and actual MCP source analysis
        env:
          REA_RUNTIME: ${{ runner.temp }}/rea-runtime/rea
          REA_REQUIRE_PASS: '1'
        run: |
          python -m unittest discover -s integrations -p 'test_rea_wiring.py'
          python -m unittest discover -s integrations -p 'test_hosted_job.py'
          python -m unittest discover -s integrations -p 'test_persist_job.py'
          python -m unittest discover -s integrations/rea -p 'test_*.py'
          node --test integrations/rea/test_browser_probe.mjs
      - name: Prepare owned fixtures and actual Money Factory source snapshot
        run: |
          python integrations/rea/prepare_jobs.py
      - name: Execute and validate all integrated operations
        run: |
          for name in source mcp native process browser project; do
            python integrations/hosted_job.py "rea-$name.job.json" --runtime "$RUNNER_TEMP/rea-runtime" --output "$RUNNER_TEMP/rea-results/$name"
            python integrations/persist_job.py --artifact-dir "$RUNNER_TEMP/rea-results/$name" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --revision "$GITHUB_SHA"
            cp -r "integrations/results/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/rea-results/$name/persisted"
            rm -rf "integrations/results/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-integrated-evidence
          path: ${{ runner.temp }}/rea-results
          retention-days: 30
          if-no-files-found: warn
