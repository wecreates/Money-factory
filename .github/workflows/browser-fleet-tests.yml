name: Browser Fleet Regression Tests

on:
  pull_request:
    paths:
      - 'automation/github-browser-fleet/**'
      - '.github/workflows/browser-fleet*.yml'
      - '.github/workflows/free-browser-fleet-health.yml'
      - '.github/workflows/free-monitor-diagnostic.yml'
      - '.github/workflows/free-monitor-verify.yml'
      - '.github/workflows/free-monitor-worker.yml'
      - '.github/workflows/render-immediate-check-verify.yml'
      - '.github/workflows/render-monitor-cutover-verify.yml'
  push:
    branches: [main]
    paths:
      - 'automation/github-browser-fleet/**'
      - '.github/workflows/browser-fleet*.yml'
      - '.github/workflows/free-browser-fleet-health.yml'
      - '.github/workflows/free-monitor-diagnostic.yml'
      - '.github/workflows/free-monitor-verify.yml'
      - '.github/workflows/free-monitor-worker.yml'
      - '.github/workflows/render-immediate-check-verify.yml'
      - '.github/workflows/render-monitor-cutover-verify.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: automation/github-browser-fleet
